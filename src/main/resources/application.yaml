spring:
  threads:
    virtual:
      enabled: true

  application:
    name: Razorpay

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/Razorpay}
    username: ${DB_USER:diwakar}
    password: ${DB_PW:diwakar}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      pasword: ${REDIS_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    listener:
      ack-mode: manual
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        retries: 3
        spring.json.add.type.headers: false
    consumer:
      group-id: razorpay-monolith
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.package: "com.codingshuttle.razorpay.*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: java.util.LinkedHashMap

server:
  port: 8000

vault:
  master-key: KfouCiZG8UBB/AIV3JYNieUHc5HF4esrPmZyLQjOSMo=

jwt:
  secret-key: dont-use-in-prod-lskjdflksdjflsj1234kjlkjlkjsj;dlkfjsalkfjlkysoy

payment:
  simulator:
    poll-interval-ms: 5000
    chaos-mode: NORMAL
    methods:
      CARD:
        min-delay-seconds: 2
        max-delay-seconds: 6
        success-rate: 90
      UPI:
        min-delay-seconds: 1
        max-delay-seconds: 3
        success-rate: 95
      NET_BANKING:
        min-delay-seconds: 4
        max-delay-seconds: 10
        success-rate: 85

app:
  rate-limit:
    method: fixed
    use-case:
      api-key:
        requests-per-minute: 20
  kafka:
    topics:
      payments: payments.events
      orders: orders.events
      refunds: refunds.events
      settlements: settlements.events

  webhook:
    delivery:
      redis-key: "webhook-retry"
      poll-batch-size: 100
